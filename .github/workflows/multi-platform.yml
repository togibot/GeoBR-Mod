name: Build GeoBR Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/geobr-main-levels"
  pull_request:
    branches:
      - "main"
      - "feature/geobr-main-levels"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package .geode builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Collect .geode files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geobr-install
          find "${{ steps.build.outputs.build-output }}" -type f -name '*.geode' -print -exec cp {} geobr-install/ \;
          test -n "$(find geobr-install -maxdepth 1 -type f -name '*.geode' -print -quit)"
          echo "Built GeoBR packages:"
          find geobr-install -maxdepth 1 -type f -name '*.geode' -print

      - name: Upload .geode files
        uses: actions/upload-artifact@v4
        with:
          name: GeoBR-Main-Levels-V1
          path: geobr-install/*.geode
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete build output
        uses: actions/upload-artifact@v4
        with:
          name: GeoBR-Main-Levels-V1-complete
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
